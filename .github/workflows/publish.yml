name: Publish to npm

# 🔧 Workflow Configuration
# 🎯 Easy customization: Update these values to customize the workflow for different releases
# 📦 Library info is dynamically extracted from package.json (Angular version, package size, etc.)
# 🚀 Release notes are automatically generated with current Angular version information
#
# 🔐 npm authentication: Trusted Publishing (OIDC), no token is stored in this repository.
# The package must list this repository and this workflow file (publish.yml) as a
# trusted publisher on npmjs.com, see PUBLISHING.md. Renaming this file breaks publishing
# until the trusted publisher is updated to match.
env:
  LIBRARY_NAME: "ngx-country-selector"
  SCOPED_NAME: "@evicio1/ngx-country-selector"  # For GitHub Packages
  NODE_VERSION: "24.x"  # Angular 22 requires Node ^22.22.3 || ^24.15.0
  LIBRARY_PROJECT: "country-selector-library"
  
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push tags
      packages: write  # Required to publish to GitHub Packages
      id-token: write  # Required for npm trusted publishing (OIDC) and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build the library
        run: npm run build:lib

      - name: Get package information
        id: package_info
        run: |
          CURRENT_VERSION=$(node -p "require('./projects/${{ env.LIBRARY_PROJECT }}/package.json').version")
          ANGULAR_VERSION=$(node -p "require('./package.json').dependencies['@angular/core']")
          TYPESCRIPT_VERSION=$(node -p "require('./package.json').devDependencies['typescript']")
          # Size of what gets published (the build output), not of the source folder
          PACKAGE_SIZE=$(du -sh dist/${{ env.LIBRARY_PROJECT }} | cut -f1)

          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "angular_version=$ANGULAR_VERSION" >> $GITHUB_OUTPUT
          echo "typescript_version=$TYPESCRIPT_VERSION" >> $GITHUB_OUTPUT
          echo "package_size=$PACKAGE_SIZE" >> $GITHUB_OUTPUT
          
          echo "Package Version: $CURRENT_VERSION"
          echo "Angular Version: $ANGULAR_VERSION"
          echo "Package Size: $PACKAGE_SIZE"

      - name: Check if version exists on npm
        id: check_version
        run: |
          CURRENT_VERSION="${{ steps.package_info.outputs.version }}"
          echo "Checking if version $CURRENT_VERSION exists on npm..."

          # Check if the version exists on npm
          if npm view ${{ env.LIBRARY_NAME }}@$CURRENT_VERSION version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "❌ Version $CURRENT_VERSION already exists on npm"

            # Get the latest version and suggest next version
            LATEST_VERSION=$(npm view ${{ env.LIBRARY_NAME }} version)
            echo "Latest version on npm: $LATEST_VERSION"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Version $CURRENT_VERSION does not exist on npm, proceeding with publish"
          fi

      - name: Stop if version exists
        if: steps.check_version.outputs.exists == 'true'
        run: |
          echo "❌ Cannot publish: Version ${{ steps.package_info.outputs.version }} already exists on npm"
          echo "Please update the version in projects/${{ env.LIBRARY_PROJECT }}/package.json"
          echo "Current version: ${{ steps.package_info.outputs.version }}"
          LATEST_VERSION=$(npm view ${{ env.LIBRARY_NAME }} version)
          echo "Latest version on npm: $LATEST_VERSION"
          exit 1

      # README.md and LICENSE.txt are copied into dist by `npm run build:lib` (postbuild:lib)
      - name: Show package info
        if: steps.check_version.outputs.exists == 'false'
        run: |
          # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0
          echo "node $(node -v), npm $(npm -v)"
          echo "Publishing package info:"
          cd dist/${{ env.LIBRARY_PROJECT }}
          cat package.json | jq '{name, version, repository}'
          echo "Package contents:"
          ls -la

      - name: Publish to npm
        if: steps.check_version.outputs.exists == 'false'
        run: |
          cd dist/${{ env.LIBRARY_PROJECT }}
          # Remove any problematic git references
          rm -rf .git 2>/dev/null || true
          # No token: npm exchanges this job's OIDC identity for a short-lived publish
          # credential and attaches provenance automatically. An auth error here means the
          # trusted publisher on npmjs.com does not match this repository and workflow file.
          npm publish --access public

      - name: Check if tag already exists
        if: steps.check_version.outputs.exists == 'false'
        id: check_tag
        run: |
          PUBLISHED_VERSION=$(node -p "require('./dist/${{ env.LIBRARY_PROJECT }}/package.json').version")
          if git rev-parse "v$PUBLISHED_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$PUBLISHED_VERSION already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$PUBLISHED_VERSION does not exist"
          fi

      - name: Create and push git tag
        if: steps.check_version.outputs.exists == 'false' && success() && steps.check_tag.outputs.exists == 'false'
        id: create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUBLISHED_VERSION=$(node -p "require('./dist/${{ env.LIBRARY_PROJECT }}/package.json').version")
          echo "Creating and pushing tag v$PUBLISHED_VERSION"
          git tag "v$PUBLISHED_VERSION"
          git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git
          git push origin "v$PUBLISHED_VERSION"
          echo "tag_name=v$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        if: steps.check_version.outputs.exists == 'false' && success() && steps.check_tag.outputs.exists == 'false'
        id: release_notes
        run: |
          VERSION="${{ steps.package_info.outputs.version }}"
          ANGULAR_VERSION="${{ steps.package_info.outputs.angular_version }}"
          TYPESCRIPT_VERSION="${{ steps.package_info.outputs.typescript_version }}"
          PACKAGE_SIZE="${{ steps.package_info.outputs.package_size }}"

          # Extract major version from Angular version (e.g., "^20.3.2" -> "20")
          ANGULAR_MAJOR=$(echo $ANGULAR_VERSION | sed 's/[^0-9]*\([0-9]\+\).*/\1/')
          
          echo "Generating release notes for version $VERSION"

          # Create dynamic release notes
          cat > release_notes.md << EOF
          ## 🚀 ${{ env.LIBRARY_NAME }} v$VERSION

          ### What's New in This Release
          - **Angular $ANGULAR_MAJOR Support**: Built and tested against Angular $ANGULAR_VERSION
          - Full list of changes: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          - Published to npm: https://www.npmjs.com/package/${{ env.LIBRARY_NAME }}

          ### 🎯 Key Features
          - ✨ **Signal Forms Support**: Implements \`FormValueControl\` interface for modern Angular forms
          - 🎨 Built with Angular Material Design components (v$ANGULAR_MAJOR)
          - 🏳️ Visual country flags for all countries
          - 🔍 Built-in search and autocomplete functionality
          - ⚡ Performance optimized with Angular $ANGULAR_MAJOR features and signals
          - ♿ Full accessibility support with ARIA attributes
          - 📱 Responsive design for all device sizes
          - 🚀 Zoneless change detection compatible

          ### 📦 Installation
          \`\`\`bash
          npm install ${{ env.LIBRARY_NAME }}@$VERSION
          \`\`\`

          ### 🛠️ Requirements
          - Angular $ANGULAR_MAJOR+ (any $ANGULAR_MAJOR.x version)
          - Angular Material $ANGULAR_MAJOR+
          - A Node.js version supported by Angular $ANGULAR_MAJOR (built with ${{ env.NODE_VERSION }})
          - TypeScript $TYPESCRIPT_VERSION

          ### 💡 Usage with Signal Forms
          \`\`\`typescript
          import { form, FormField, required } from '@angular/forms/signals';
          import { CountrySelectorLibraryComponent } from 'ngx-country-selector';

          // Create signal-based form
          vm = signal({ country: null });
          myForm = form(this.vm, (p) => {
            required(p.country, { message: 'Country is required' });
          });
          \`\`\`

          \`\`\`html
          <lib-country-selector
            [formField]="myForm.country"
            label="Select Country"
          />
          \`\`\`

          ### 📊 Package Information
          - **Package Size**: $PACKAGE_SIZE
          - **Angular Version**: $ANGULAR_VERSION
          - **TypeScript**: $TYPESCRIPT_VERSION
          - **Dependencies**: Minimal (tslib ^2.3.0)
          - **Peer Dependencies**: @angular/core, common, forms and material $ANGULAR_MAJOR
          - **Form Support**: Signal Forms (\`FormValueControl\`) + Reactive Forms

          ### 🔗 Links
          - 📦 [NPM Package](https://www.npmjs.com/package/${{ env.LIBRARY_NAME }})
          - 📚 [Documentation & Usage Guide](https://github.com/${{ github.repository }}#readme)
          - 🐛 [Report Issues](https://github.com/${{ github.repository }}/issues)
          - 💡 [Feature Requests](https://github.com/${{ github.repository }}/discussions)

          ### 📝 Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes.
          EOF

          echo "Release notes created for Angular $ANGULAR_MAJOR"

      - name: Create package tarball
        if: steps.check_version.outputs.exists == 'false' && success()
        run: |
          cd dist/${{ env.LIBRARY_PROJECT }}
          # Pack next to the package folder: a tarball left inside it would be
          # shipped as part of the GitHub Packages publish below
          npm pack --pack-destination ..
          TARBALL_NAME=$(ls ../*.tgz | xargs -n 1 basename)
          echo "tarball_name=$TARBALL_NAME" >> $GITHUB_ENV
          echo "Created tarball: $TARBALL_NAME"

      - name: Create GitHub Release
        if: steps.check_version.outputs.exists == 'false' && success() && steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: "🚀 ngx-country-selector v${{ steps.package_info.outputs.version }}"
          body_path: release_notes.md
          files: |
            dist/*.tgz
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Setup Node.js for GitHub Packages
        if: steps.check_version.outputs.exists == 'false' && success()
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@evicio1'

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.exists == 'false' && success()
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/${{ env.LIBRARY_PROJECT }}

          # Update package.json for GitHub Packages
          jq '.name = "${{ env.SCOPED_NAME }}"' package.json > temp.json && mv temp.json package.json

          echo "Publishing to GitHub Packages..."
          npm publish --access public
